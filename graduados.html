<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#07152f">
  <meta name="description" content="Consulta el listado público de graduados de Educa Digital.">
  <title>Graduados | Educa Digital</title>
  <style>
    :root{--navy:#07152f;--navy2:#0b2045;--cyan:#27d9f2;--blue:#2589ff;--pink:#ec4bbd;--white:#f7fbff;--muted:#bdcce0;--line:rgba(160,205,255,.18)}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 15% 0%,rgba(37,137,255,.19),transparent 38%),radial-gradient(ellipse at 90% 85%,rgba(236,75,189,.11),transparent 35%),var(--navy);color:var(--white);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;padding:48px 18px}
    .wrap{width:min(100%,1050px);margin:auto}.brand{display:flex;align-items:center;gap:10px;color:var(--cyan);font-weight:800;letter-spacing:.12em;text-transform:uppercase;font-size:.78rem}.brand-mark{width:11px;height:11px;border-radius:50%;background:var(--cyan);box-shadow:0 0 18px var(--cyan)}h1{font-size:clamp(2rem,5vw,3.4rem);margin:18px 0 8px;letter-spacing:-.045em}.sub{color:var(--muted);margin:0 0 30px;font-size:1rem}.panel{background:linear-gradient(145deg,rgba(17,42,82,.88),rgba(8,25,54,.94));border:1px solid var(--line);border-radius:22px;padding:clamp(16px,3vw,28px);box-shadow:0 20px 60px rgba(0,0,0,.25)}.filter{display:block;width:100%;height:50px;padding:0 16px;border:1px solid rgba(39,217,242,.35);border-radius:12px;background:rgba(3,14,34,.72);color:var(--white);font:inherit;outline:none;margin-bottom:20px}.filter:focus{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(39,217,242,.12)}.table-scroll{overflow-x:auto;border:1px solid var(--line);border-radius:13px}table{width:100%;border-collapse:collapse;min-width:640px;text-align:left}thead{background:rgba(39,217,242,.09)}th{font-size:.76rem;letter-spacing:.09em;color:var(--cyan);padding:16px 18px;font-weight:800}td{padding:16px 18px;border-top:1px solid var(--line);color:#eaf4ff;font-size:.94rem}tbody tr:hover{background:rgba(37,137,255,.07)}td:first-child{font-weight:800;color:var(--cyan);white-space:nowrap}.empty{text-align:center;color:var(--muted);padding:28px}.pagination{display:flex;align-items:center;justify-content:center;gap:18px;margin:20px 0 0}.page-btn{width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:rgba(37,137,255,.12);color:var(--white);font-size:1.25rem;cursor:pointer}.page-btn:hover:not(:disabled){border-color:var(--cyan);color:var(--cyan)}.page-btn:disabled{opacity:.3;cursor:not-allowed}.page-info{color:var(--muted);font-size:.9rem;min-width:105px;text-align:center}.foot{text-align:center;color:#8298b8;font-size:.82rem;margin-top:25px}.status{color:var(--muted);font-size:.88rem;margin-top:14px;min-height:1.2em}
    @media(max-width:600px){body{padding:30px 12px}.panel{border-radius:17px}.pagination{gap:14px}}
  </style>
</head>
<body>
  <main class="wrap">
    <div class="brand"><span class="brand-mark"></span> Educa Digital</div>
    <h1>Graduados</h1>
    <p class="sub">Consulta el registro de graduados de Educa Digital.</p>
    <section class="panel" aria-label="Listado de graduados">
      <label for="filtro-codigo" style="position:absolute;left:-9999px">Filtrar por código de graduado</label>
      <input id="filtro-codigo" class="filter" type="search" maxlength="20" placeholder="Buscar por código de graduado…" autocomplete="off">
      <div class="table-scroll">
        <table>
          <thead><tr><th>CÓDIGO</th><th>APELLIDO</th><th>NOMBRE</th><th>FECHA DE GRADUACIÓN</th></tr></thead>
          <tbody id="lista-graduados"><tr><td class="empty" colspan="4">Cargando graduados…</td></tr></tbody>
        </table>
      </div>
      <nav class="pagination" aria-label="Paginación">
        <button class="page-btn" id="pagina-anterior" type="button" aria-label="Página anterior" disabled>‹</button>
        <span class="page-info" id="pagina-info">Página 1 de 1</span>
        <button class="page-btn" id="pagina-siguiente" type="button" aria-label="Página siguiente" disabled>›</button>
      </nav>
      <div class="status" id="estado-listado" role="status" aria-live="polite"></div>
    </section>
    <footer class="foot">© <span id="year"></span> Educa Digital</footer>
  </main>
  <script type="module" src="carga.js"></script>
</body>
</html>
